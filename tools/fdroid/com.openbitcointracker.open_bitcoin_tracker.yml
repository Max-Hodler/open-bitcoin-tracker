Categories:
  - Money
License: MIT
AuthorName: Max-Hodler
WebSite: https://openbitcointracker.com
SourceCode: https://github.com/Max-Hodler/open-bitcoin-tracker
IssueTracker: https://github.com/Max-Hodler/open-bitcoin-tracker/issues

RepoType: git
Repo: https://github.com/Max-Hodler/open-bitcoin-tracker

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    submodules: true
    output: build/app/outputs/flutter-apk/app-release.apk
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - submodules/flutter/bin/flutter config --no-analytics
      - submodules/flutter/bin/flutter pub get
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - submodules/flutter/bin/flutter build apk --release --target-platform android-arm,android-arm64
    scanignore:
      - submodules/flutter/bin/cache
      - submodules/flutter/packages/flutter_tools/gradle/flutter.gradle
    scandelete:
      - submodules/flutter
      - .pub-cache

