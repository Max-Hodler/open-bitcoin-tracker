name: Open Bitcoin Tracker
summary: A private, open-source value tracker for your bitcoin stacks
description: |
  Open source bitcoin portfolio tracker.

  Features:
  - Total privacy: The amount in each stack is entered by hand and never leaves your phone.
  - Fast and lightweight: OBT doesn't connect to a node so it loads fast and has minimal battery impact.
  - Handy converter: bitcoin to sats and fiat.
  - Multiple languages and currencies.
  - Auto Light and Dark modes.


license: MIT
