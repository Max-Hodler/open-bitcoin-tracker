name: open_bitcoin_tracker
description: "Open Bitcoin Tracker. A value tracker for your bitcoin portfolio."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  http: ^1.6.0
  provider: ^6.1.5+1
  intl: ^0.20.2
  fl_chart: ^1.1.2
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  biometric_storage: ^5.0.1
  url_launcher: ^6.3.1
  web_socket_channel: ^3.0.1
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  fake_async: ^1.3.1
  stream_channel: ^2.1.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/btc_history.csv
    - assets/fx_history.csv

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
